<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f2ea" />
    <title>Coffee</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Coffee</h1>
        <p class="count" id="count"></p>
      </div>
      <div class="head-actions">
        <button class="ghost" id="exportBtn" type="button" hidden>
          Export
        </button>
        <a class="ghost" id="authLink" href="/login">Sign in</a>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-view="ledger" aria-selected="true">Ledger</button>
      <button role="tab" data-view="add" aria-selected="false" hidden>
        Add
      </button>
      <button role="tab" data-view="next" aria-selected="false" hidden>
        Next
      </button>
    </nav>

    <main>
      <section id="view-ledger">
        <ul class="bags" id="bagList"></ul>
        <p class="empty" id="ledgerEmpty" hidden>Nothing here yet.</p>
        <p class="fine" id="publicNote" hidden>
          The list is public. <a href="/login">Sign in</a> to add a bag or rate
          one.
        </p>
      </section>

      <section id="view-add" hidden>
        <form id="addForm" autocomplete="off">
          <label>
            Roaster
            <input
              name="roaster"
              id="roaster"
              required
              placeholder="Sip Magic"
            />
          </label>
          <label>
            Coffee
            <input
              name="name"
              id="coffee"
              required
              placeholder="Mysore Nuggets Bold"
            />
            <div class="suggest" id="suggest" hidden></div>
          </label>
          <div class="row">
            <label>
              Price ₹
              <input
                name="price"
                id="price"
                type="number"
                inputmode="decimal"
                min="0"
                step="1"
                placeholder="599"
              />
            </label>
            <label>
              Weight g
              <input
                name="grams"
                id="grams"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                value="250"
              />
            </label>
          </div>
          <div class="row">
            <label>
              Roast
              <select name="roast" id="roast">
                <option value="">Not sure</option>
                <option>light</option>
                <option>light-medium</option>
                <option>medium</option>
                <option>medium-dark</option>
                <option>dark</option>
              </select>
            </label>
            <label>
              Bought
              <input name="date" id="date" type="date" />
            </label>
          </div>

          <fieldset>
            <legend>How was it? <span>optional, tap a score</span></legend>
            <div class="score-row">
              <span>Black</span>
              <div class="score" id="blackScore" data-axis="black"></div>
            </div>
            <div class="score-row">
              <span>Milk</span>
              <div class="score" id="milkScore" data-axis="milk"></div>
            </div>
          </fieldset>

          <label>
            Note
            <input
              name="note"
              id="note"
              placeholder="toffee, hazelnut, low bitterness"
            />
          </label>

          <button class="primary" type="submit">Save bag</button>
        </form>
      </section>

      <section id="view-next" hidden>
        <div class="picks" id="picks"></div>
        <p class="empty" id="nextEmpty" hidden>
          Rate a few bags first — two scores per bag is enough.
        </p>
        <p class="fine" id="nextFine"></p>
      </section>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
